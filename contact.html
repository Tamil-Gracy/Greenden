<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenden</title>
    <link href="./src/output.css" rel="stylesheet">
</head>

<body>
    <header class="bg-[#dce7c7] shadow-2xl sticky top-0 z-10">
        <nav class="px-10 py-5 flex items-center justify-between gap-5">
            <a href="index.html">
                <h1 class="text-2xl font-bold text-green-800 uppercase cursor-pointer">Greenden</h1>
            </a>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-6 md:hidden text-green-800">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            </svg>

            <ul class="flex justify-between gap-5 hidden md:flex text-green-950">
                <li><a href="index.html" class="hover:text-green-700">Home</a></li>
                <li><a href="about.html" class="hover:text-green-700">About</a></li>
                <li><a href="products.html" class="hover:text-green-700">Products</a></li>
                <li><a href="contact.html" class="hover:text-green-700">Contact</a></li>
            </ul>
        </nav>
    </header>
    <section class="py-10">
        <h2 class="font-bold text-2xl text-center">Contact Us</h2>
        <p class="text-center p-4">Got a technical issue? Want to send feedback about a beta feature? Need details about
            our Business plan? Let us know.</p>
        <form class="px-4 mt-6">
            <div class="space-y-6 max-w-md mx-auto">
                <div>
                    <label for="name" class="text-slate-900 font-medium text-[13px] inline-block mb-1">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required
                        class="px-1 py-2.5 text-sm text-slate-900 bg-white w-full border-b-2 border-slate-300 focus:border-green-900 outline-none" />
                </div>
                <div>
                    <label for="email" class="text-slate-900 font-medium text-[13px] inline-block mb-1">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your mail id" required
                        class="px-1 py-2.5 text-sm text-slate-900 bg-white w-full border-b-2 border-slate-300 focus:border-green-900 outline-none" />
                </div>
                <div>
                    <label for="address"
                        class="text-slate-900 font-medium text-[13px] inline-block mb-1">Message</label>
                    <input type="text" id="address" name="address" placeholder="What you want to share..." required
                        class="px-1 py-2.5 text-sm text-slate-900 bg-white w-full border-b-2 border-slate-300 focus:border-green-900 outline-none" />
                </div>

                <button type="submit"
                    class="!mt-2 py-2 px-3.5 text-sm rounded-md font-semibold cursor-pointer tracking-wide text-white border border-green-900 bg-green-900  ">Submit</button>
            </div>
        </form>
    </section>
<!--Footer section-->
    <footer class="bg-[#dce7c7] p-10 md:p-5 mt-10 flex justify-between items-center flex-wrap gap-5">
        <h1 class="text-xl md:text-2xl font-bold text-green-800 uppercase cursor-pointer">Greenden</h1>
         <ul class="flex justify-between gap-5 md:flex text-green-950">
                <li><a href="index.html" class="hover:text-green-700">Home</a></li>
                <li><a href="about.html" class="hover:text-green-700">About</a></li>
                <li><a href="products.html" class="hover:text-green-700">Products</a></li>
                <li><a href="contact.html" class="hover:text-green-700">Contact</a></li>
            </ul>
        <p class="text-green-900 text-sm">@ 2026 Greenden.com</p>
    </footer>
</body>

</html>
